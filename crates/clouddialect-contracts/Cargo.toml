[package]
name = "clouddialect-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "CloudDialect contracts and evidence foundation"
repository = "https://github.com/VincentChuWaiChow/CloudDialect"
license-file = "../../LICENSE.md"
publish = false

[dependencies]
boon = "=0.6.1"
include_dir = "=0.7.4"
regex = "=1.13.1"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
sha2 = { version = "=0.11.1", default-features = false }
sha3 = { version = "=0.12.0", default-features = false }
toml = { version = "=0.9.9", features = ["serde"] }
uuid = { version = "=1.28.0", features = ["v4"] }
