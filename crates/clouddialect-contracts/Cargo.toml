[package]
name = "clouddialect-contracts"
version = "0.1.0"
edition = "2024"
description = "CloudDialect contracts and evidence foundation"
repository = "https://github.com/VincentChuWaiChow/CloudDialect"
license-file = "../../LICENSE.md"
publish = false

[dependencies]
boon = "=0.6.1"
include_dir = "=0.7.4"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=0.9.9", features = ["serde"] }
uuid = { version = "=1.28.0", features = ["v4"] }
